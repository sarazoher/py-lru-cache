[project]
name = "py-lru-cache"
version = "2.0.0"
description = "O(1) thread-safe LRU cache with a memoisation decorator"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["lru"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
